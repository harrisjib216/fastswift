name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Validate every record
        run: swift run --package-path tools catalog check
      - name: The rendered catalog matches the records
        run: |
          swift run --package-path tools catalog render
          git diff --exit-code -- catalog README.md
